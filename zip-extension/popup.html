<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; color: #1d2226; margin: 0; padding: 12px 14px; width: 220px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; flex: none; }
  .dot.on { background: #057642; }
  .dot.off { background: #cc1016; }
  #status { margin-top: 6px; color: #555; font-size: 12px; }
  #status:empty { display: none; }
  button { margin-top: 10px; width: 100%; padding: 6px; border: 0; border-radius: 14px; cursor: pointer;
           background: #0a66c2; color: #fff; font-weight: 600; font-size: 12px; }
  button:hover { background: #004182; }
</style>
</head>
<body>
  <h1>Zip Solver</h1>
  <div class="row"><span class="dot" id="dot"></span><span id="player">Checking auto_play.py…</span></div>
  <div id="status"></div>
  <button id="open" hidden>Open Zip</button>
  <script src="popup.js"></script>
</body>
</html>
